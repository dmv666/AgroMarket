# Configuración del análisis de SonarQube (ver docker-compose.sonar.yml y README).

sonar.projectKey=agromarket
sonar.projectName=AgroMarket
sonar.sourceEncoding=UTF-8

# --- Código fuente y tests ---
sonar.sources=backend,frontend/src
sonar.tests=backend
sonar.test.inclusions=backend/**/tests.py,backend/**/test_*.py,backend/**/tests/**
sonar.exclusions=**/migrations/**,**/node_modules/**,frontend/dist/**,backend/media/**,backend/staticfiles/**

# --- Backend (Python 3.12) ---
sonar.python.version=3.12
# Generado por sonar-scan.sh (pytest --cov, con la ruta <source> ajustada a la raíz del repo).
sonar.python.coverage.reportPaths=backend/coverage.xml
# Configuración de Django y archivos de arranque no llevan tests unitarios.
sonar.coverage.exclusions=backend/config/**,backend/manage.py,backend/**/admin.py,backend/**/apps.py,backend/**/management/**
