# Servidor local de SonarQube para el análisis estático de todo el repo.
# Vive en un compose aparte (proyecto "agromarket-sonar") para no cargar
# los ~2 GB de RAM de SonarQube cada vez que se levanta la app. Ver README.

name: agromarket-sonar

services:
  sonar-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sonar
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar"]
      interval: 5s
      timeout: 5s
      retries: 10

  sonarqube:
    image: sonarqube:community
    restart: unless-stopped
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    ports:
      - "9000:9000"
    depends_on:
      sonar-db:
        condition: service_healthy

  # Solo se ejecuta bajo demanda: `docker compose -f docker-compose.sonar.yml run --rm scanner`
  # Lee la configuración de sonar-project.properties y el token de .env.sonar.
  scanner:
    image: sonarsource/sonar-scanner-cli
    profiles: ["scan"]
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
    env_file:
      - path: .env.sonar
        required: false
    volumes:
      - .:/usr/src
    depends_on:
      - sonarqube

volumes:
  sonar_db_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
